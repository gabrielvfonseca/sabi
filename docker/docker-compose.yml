version: "3.8"

services:
  sabi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sabi:latest
    environment:
      - SABI_USERNAME=${SABI_USERNAME:-}
      - SABI_PASSWORD=${SABI_PASSWORD:-}
      - SABI_OUTPUT=/data/sabi_records.csv
      - SABI_DB=/data/sabi_records.sqlite
    volumes:
      - ./data:/data
    command: >
      --search ""
      --output /data/sabi_records.csv
      --db /data/sabi_records.sqlite

  sabi-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sabi:mcp
    environment:
      - SABI_USERNAME=${SABI_USERNAME:-}
      - SABI_PASSWORD=${SABI_PASSWORD:-}
    ports:
      - "8000:8000"
    entrypoint: ["python", "-m", "src.mcp_server"]
    command: --transport streamable-http --host 0.0.0.0 --port 8000
